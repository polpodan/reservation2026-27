<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration – Réservations</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><p class="eyebrow">École secondaire du Maréchal</p><h1>Administration</h1><p class="sub">Gestion des réservations.</p></div><button class="secondary" onclick="location.href='index.html'">← Calendrier</button></header><section class="slots" style="display:block;margin-top:25px"><label>Clé d’administration<input id="key" type="password" autocomplete="current-password"></label><button id="load" class="primary">Afficher les réservations</button><p id="msg" class="msg"></p><div id="list"></div></section></main><script src="config.js"></script><script>async function load(){const key=document.getElementById('key').value;const msg=document.getElementById('msg');const box=document.getElementById('list');if(!API_URL.startsWith('http')){msg.textContent='Configurez API_URL dans config.js.';return}msg.textContent='';box.innerHTML='Chargement…';try{const r=await fetch(API_URL+'?action=list&key='+encodeURIComponent(key));const d=await r.json();if(d.error){msg.textContent=d.error;box.innerHTML='';return}box.innerHTML=(d.reservations||[]).map(x=>`<div class="admin-row"><div><strong>${x.date}</strong> — P${x.period}<br>${esc(x.name)}${x.reason?' — '+esc(x.reason):''}</div><button data-id="${x.id}">Annuler</button></div>`).join('')||'<p>Aucune réservation.</p>';box.querySelectorAll('button').forEach(b=>b.onclick=()=>cancel(b.dataset.id,key))}catch(e){msg.textContent='Erreur de communication avec le serveur.';box.innerHTML=''}}async function cancel(id,key){if(!confirm('Annuler cette réservation ?'))return;const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'cancel',id,key})});const d=await r.json();if(!d.ok)alert(d.error||'Erreur');else load()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('load').onclick=load;</script></body></html>
