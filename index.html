<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réservation – Aide en mathématiques</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><p class="eyebrow">École secondaire du Maréchal</p><h1>Réservation – aide en mathématiques</h1><p class="sub">Choisissez une date et une période où Dany est disponible.</p></div><button id="adminBtn" class="secondary">Administration</button></header><section class="toolbar"><button id="prev">‹</button><h2 id="month"></h2><button id="next">›</button></section><div id="calendar" class="calendar"></div><section id="slots" class="slots hidden"><div class="slot-head"><h2 id="selectedDate"></h2><button id="closeSlots">Fermer</button></div><div id="slotList"></div></section><section id="booking" class="modal hidden"><div class="modal-card"><button class="x" id="closeBooking">×</button><h2>Réserver une période</h2><p id="bookingInfo"></p><label>Votre nom<input id="name" maxlength="80" autocomplete="name"></label><label>Objet de la rencontre <span class="optional">(facultatif)</span><textarea id="reason" maxlength="200" rows="3"></textarea></label><button id="confirm" class="primary">Confirmer la réservation</button><p id="bookingMsg" class="msg"></p></div></section><section id="admin" class="modal hidden"><div class="modal-card wide"><button class="x" id="closeAdmin">×</button><h2>Administration</h2><p>Cette interface sert à consulter et annuler les réservations. La protection d'accès est assurée côté Apps Script.</p><button id="refreshAdmin" class="secondary">Actualiser</button><div id="adminList"></div></div></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
